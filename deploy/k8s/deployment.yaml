apiVersion: apps/v1
kind: Deployment
metadata:
  name: burn-emulator-api
  namespace: burn-emulator-api
  labels:
    app: burn-emulator-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: burn-emulator-api
  template:
    metadata:
      labels:
        app: burn-emulator-api
    spec:
      serviceAccountName: burn-emulator-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: burn-emulator-api
          image: gcr.io/planscape/burn-emulator-api:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BURN_EMULATOR_REDIS_ADDR
              value: redis.burn-emulator-api.svc.cluster.local:6379
          envFrom:
            - secretRef:
                name: burn-emulator-api-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
