[project]
name = "burn-emulator-runner"
version = "0.1.0"
description = "GPU inference job for burn-emulator"
requires-python = ">=3.12"
dependencies = [
    "burn-emulator-model",
]

[project.scripts]
burn-emulator-runner = "burn_emulator_runner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/burn_emulator_runner"]

[tool.uv.sources]
burn-emulator-model = { path = "../burn-emulator-model", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[tool.ruff]
extend = "../ruff.toml"
