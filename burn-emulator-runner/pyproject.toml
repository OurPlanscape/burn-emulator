[project]
name = "burn-emulator-runner"
version = "0.1.0"
description = "Long-lived GPU inference service for burn-emulator"
requires-python = ">=3.12"
dependencies = [
    "burn-emulator",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
burn-emulator-runner = "burn_emulator_runner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/burn_emulator_runner"]

[tool.uv.sources]
burn-emulator = { path = "../burn-emulator-model", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
