dataloader:
    class_path: torch.utils.data.DataLoader
    init_args:
        batch_size: 512
        shuffle: true
        pin_memory: false
        drop_last: true
optimizer:
    class_path: torch.optim.AdamW
    init_args:
        lr: .003
criterion:
    class_path: burn_emulator.criterions.DiceCELoss
    init_args: {}
num_epochs: 32
model_name: wc711_480_wind