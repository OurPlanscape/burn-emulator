dataloader:
    class_path: torch.utils.data.DataLoader
    init_args:
        batch_size: 32
        shuffle: true
        pin_memory: false
        drop_last: true
optimizer:
    class_path: torch.optim.AdamW
    init_args:
        lr: .0003
criterion:
    class_path: burn_emulator.criterions.DiceCELoss
    init_args: {}
num_epochs: 128
model_name: wc711_480_sm_rand_wind_10