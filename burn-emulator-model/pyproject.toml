[project]
name = "burn-emulator"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.25.0",
    "cloudpathlib[azure,gs,s3]>=0.24.0",
    "geopandas>=1.1.4",
    "google-cloud-storage>=3.13.0",
    "matplotlib>=3.11.1",
    "omegaconf>=2.3.0",
    "pointpats",
    "pyyaml>=6.0.3",
    "rasterio>=1.4.3,<1.5",
    "torch>=2.13.0",
    "torch-geometric>=2.8.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.28.0",
]

[project.optional-dependencies]
# training-data generation only (scripts/create_training_data.py, scripts/pyretechnics.py)
data = ["pyretechnics", "ray"]

[project.scripts]
burn_emulator = "burn_emulator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/burn_emulator"]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
